name: Bundle Parity

# Guards the two hand-edited copies of every pipeline script — .claude/scripts/
# (this repo's own pipeline) and plugins/pipeline-core/scripts/ (what
# consumers install via the plugin bundle) — from silently drifting apart
# (issue #623). Runs on every push/PR that touches either tree so a change
# made only to one side fails before it can be tagged (AC5), independent of
# skill-golden.yml's decide-*/schemas/skills-scoped triggers.
#
# The hook trees (.claude/hooks/ and plugins/pipeline-core/hooks/scripts/) are
# in the trigger set too (issue #788). test-bundle-parity.bats has asserted
# hook parity since #640, but the triggers listed only the script trees, so a
# hook-only change could not reach the guard: PR #785 shipped a drifted
# post-pr-simplify.sh with `gh pr checks` reporting no checks at all, and the
# break reached main and later blocked an unrelated PR from merging. Every
# tree the guard compares must appear here — enforced by the "(#788) triggers
# on every tree the parity guard checks" test in tests/sync-bundle.bats.
#
# sync.sh and tests/sync-bundle.bats are in the trigger set too: sync.sh is
# the generator that produces the bundle, and its BUNDLE_SCRIPT_SUBDIRS list
# must stay in lockstep with the guard's PARITY_SUBDIRS, so a change to
# either side has to re-run both suites.
#
# The plugin manifests (.claude-plugin/marketplace.json and
# plugins/pipeline-core/.claude-plugin/plugin.json) are in the trigger set
# too (issue #893): a version-bump PR that only touches these files is
# exactly the commit a release depends on, and with no workflow matching
# manifest paths it merged CLEAN with zero checks run (0.8.7, 0.8.8). This
# job already owns the property a release needs — the shipped bundle
# matching the canonical tree — so widening its triggers here means a bump
# runs it with no new job to maintain.
#
# (Paths are duplicated rather than shared via a YAML anchor — the Actions
# workflow parser does not reliably support anchors/aliases.)
on:
  push:
    paths:
      - '.claude/scripts/**'
      - 'plugins/pipeline-core/scripts/**'
      - '.claude/hooks/**'
      - 'plugins/pipeline-core/hooks/scripts/**'
      - '.claude-plugin/**'
      - 'plugins/pipeline-core/.claude-plugin/**'
      - 'sync.sh'
      - 'tests/sync-bundle.bats'
      - '.github/workflows/bundle-parity.yml'
  pull_request:
    paths:
      - '.claude/scripts/**'
      - 'plugins/pipeline-core/scripts/**'
      - '.claude/hooks/**'
      - 'plugins/pipeline-core/hooks/scripts/**'
      - '.claude-plugin/**'
      - 'plugins/pipeline-core/.claude-plugin/**'
      - 'sync.sh'
      - 'tests/sync-bundle.bats'
      - '.github/workflows/bundle-parity.yml'

jobs:
  bundle-parity:
    name: Bundle Parity & Syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        uses: ./.github/actions/install-bats

      - name: Run bundle parity + bash -n guard
        run: bats .claude/scripts/implement-issue-test/test-bundle-parity.bats

      - name: Run bundle generator tests
        run: bats tests/sync-bundle.bats

      # The bundle is PRODUCED, not hand-edited: regenerating it from the
      # canonical tree must be a no-op on a correct commit. This catches a
      # bundle-only edit that happens to keep the trees byte-identical only
      # because both sides were edited inconsistently.
      - name: Verify bundle is regenerable (sync.sh bundle is a no-op)
        run: |
          ./sync.sh bundle
          if ! git diff --quiet; then
            echo "::error::Bundle is not regenerable from .claude/scripts/. Run './sync.sh bundle' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
